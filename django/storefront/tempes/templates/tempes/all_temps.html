{% extends "layout.html" %} 
{% block title %}Temps App{% endblock %} 
{% block content %}
<h1>All Temps App exists here</h1>
<div class="grid grid-cols-3 gap-4 m-4">
{% for post in posts  %}
    <div class="bg-blue-500 p-5 rounded">
                <img class="rounded-lg w-md h-auto" src="{{post.image.url}}" alt="">
                <h3>{{post.title}}</h3>
                <a href="{% url 'post_detail' post.id %}">
                <button type="button"
                class="inline-flex items-center w-[100%] justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-orange-600 hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500"
                >
                 {{post.type}}
                </button>
            </a>
    </div>
{% endfor %}
</div>

{% endblock %}
